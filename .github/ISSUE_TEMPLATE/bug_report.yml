name: 버그 및 기기 호환성 보고
description: 추론 실패, 성능 또는 기기 호환성 문제를 알려 주세요.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Pocket Canvas의 버그를 알려 주셔서 감사합니다.
        정확한 원인 파악을 위해 가능한 한 구체적으로 작성해 주세요. 로그를 첨부하기 전에는 개인정보와 로컬 파일 경로가 포함되어 있지 않은지 확인해 주세요.

  - type: dropdown
    id: area
    attributes:
      label: 버그 영역
      description: 버그와 가장 가까운 항목을 선택해 주세요.
      options:
        - 이미지 생성 또는 추론
        - 모델 가져오기 또는 분류
        - 모델 양자화
        - 히스토리 또는 이미지 관리
        - UI 또는 제스처
        - Android 빌드 또는 설치
        - 성능 또는 메모리
        - 기타
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 발생한 버그와 영향을 간단하고 명확하게 설명해 주세요.
      placeholder: 무엇이 잘못되었고 어떤 작업을 할 수 없었는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 버그를 다시 발생시킬 수 있도록 순서대로 적어 주세요.
      placeholder: |
        1. 모델 관리에서 ...
        2. 생성 화면에서 ...
        3. 생성 버튼을 누르면 ...
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Android 기기
      description: 제조사와 정확한 모델명을 적어 주세요.
      placeholder: Samsung Galaxy S26
    validations:
      required: true

  - type: input
    id: soc
    attributes:
      label: SoC
      placeholder: Snapdragon 또는 Exynos 모델명
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android 버전
      placeholder: Android 16
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Pocket Canvas 버전
      description: 릴리즈 버전 또는 테스트한 commit hash를 적어 주세요.
      placeholder: v1.0.0 또는 4a5ada0
    validations:
      required: true

  - type: dropdown
    id: model_family
    attributes:
      label: 모델 family
      description: 모델과 무관한 문제라면 해당 없음을 선택해 주세요.
      options:
        - 해당 없음
        - SD 1.5
        - SDXL
        - 알 수 없음
        - 기타
    validations:
      required: true

  - type: input
    id: model_format
    attributes:
      label: 모델 형식과 양자화
      description: 모델과 무관한 문제라면 해당 없음을 적어 주세요.
      placeholder: GGUF Q4_K, SafeTensors F16 또는 해당 없음
    validations:
      required: true

  - type: textarea
    id: generation_settings
    attributes:
      label: 생성 설정
      description: 추론 문제라면 해상도, sampler, scheduler, steps, CFG, seed, LoRA, TAESD와 Hires 설정을 적어 주세요.
      placeholder: 768x768, LCM, 4 steps, CFG 1.0, seed 1234, LoRA 없음, 기본 VAE

  - type: textarea
    id: logs
    attributes:
      label: 관련 로그
      description: 생성 로그는 `adb logcat -s StableDiffusionBridge:I '*:S'`로 확인할 수 있습니다.
      render: shell

  - type: textarea
    id: additional_context
    attributes:
      label: 추가 정보
      description: 스크린샷, 동영상 또는 원인 파악에 도움이 될 만한 내용을 첨부해 주세요.
