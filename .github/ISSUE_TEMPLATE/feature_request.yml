name: 기능 및 개선 제안
description: 새로운 기능, 사용성 개선 또는 아키텍처 변경을 제안해 주세요.
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: |
        Pocket Canvas를 개선하기 위한 제안을 환영합니다.
        구현 방법보다 먼저 해결하려는 문제와 사용자에게 주는 가치를 설명해 주세요.

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - 이미지 생성과 생성 옵션
        - 모델 관리와 가져오기
        - 모델 양자화
        - 히스토리와 이미지 관리
        - UI와 접근성
        - 성능과 메모리
        - Android 빌드와 배포
        - 네이티브 모듈
        - 문서
        - 기타
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 불편이나 제약이 있는지 설명해 주세요.
      placeholder: 어떤 사용자가 어떤 상황에서 어려움을 겪는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 동작이나 사용자 경험을 설명해 주세요.
    validations:
      required: true
